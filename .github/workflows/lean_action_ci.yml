name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The API documentation is built and published together with the project
# dashboard by `pages.yml`. Do not add a GitHub Pages deployment here: every
# Pages deployment replaces the entire site.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail
